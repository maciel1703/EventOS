<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventOS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet"
    >

   <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="participantes.css">
<link rel="stylesheet" href="src/output.css">
</head>

<body>

    <!-- ===================== SIDEBAR ===================== -->

    <aside
    class="fixed top-0 left-0 flex h-screen w-[230px] flex-col justify-between border-r border-ink/10 bg-surface p-6"
    id="sidebar"
>

        <!-- TOPO DA SIDEBAR -->
        <div>

            <!-- BRAND -->
            <div class="flex items-center gap-[7px]">

                <span
                    class="flex h-[34px] w-[34px] items-center justify-center rounded-[9px] bg-gradient-to-br from-accent to-[#FF8A65] font-medium text-white"
                >
                    EF
                </span>

                <span class="font-display text-[1.25rem] font-bold text-ink">
                    EventFlow
                </span>

            </div>

            <!-- NAVEGAÇÃO -->
            <ul
                class="m-0 mt-6 flex list-none flex-col gap-[5px] p-0"
                id="navList"
            >

                <!-- DASHBOARD -->
                <li>
                    <a
                        href="index.html"
                        class="nav-item flex w-full items-center justify-start gap-2 rounded-lg px-3 py-2 font-body hover:bg-bg-soft"
                    >
                        <span class="ico flex w-5 justify-start">◆</span>
                        Dashboard
                    </a>
                </li>

                <!-- EVENTOS -->
                <li>
                    <a
                        href="eventos.html"
                        class="nav-item flex w-full items-center justify-start gap-2 rounded-lg px-3 py-2 font-body hover:bg-bg-soft"
                    >
                        <span class="ico flex w-5 justify-start">🎟</span>
                        Eventos
                    </a>
                </li>

                <!-- PARTICIPANTES -->
                <li>
                    <a
                        href="participantes.html"
                        class="nav-item active flex w-full items-center justify-start gap-2 rounded-lg bg-accent px-3 py-2 font-body text-white!"
                    >
                        <span class="ico flex w-5 justify-start">◉</span>
                        Participantes
                    </a>
                </li>

                <!-- INSCRIÇÕES -->
                <li>
                    <button
                        class="nav-item flex w-full items-center justify-start gap-2 rounded-lg px-3 py-2 font-body hover:bg-bg-soft"
                        data-view="inscricoes"
                    >
                        <span class="ico flex w-5 justify-start">✔</span>
                        Inscrições
                    </button>
                </li>

            </ul>

        </div>

        <!-- RODAPÉ DA SIDEBAR -->
        <div class="sidebar-foot font-mono text-sm">
            EventFlow v0.2 · por MACIEL//DEV
        </div>

    </aside>

    <div class="scrim" id="scrim"></div>


    <!-- ===================== CONTEÚDO PRINCIPAL ===================== -->

    <main class="ml-0 min-h-screen md:ml-[230px]">

        <!-- EVENTOS PAGE -->

        <header class="flex items-center justify-between px-6 py-4">

            <div class="flex items-center gap-4">

                <button
                    id="menuToggle"
                    class="flex md:hidden h-9 w-9 items-center justify-center rounded-full border border-ink/10 bg-surface text-ink"
                    aria-label="Abrir menu"
                >
                    ☰
                </button>

                <h3 class="font-display text-2xl font-semibold text-ink px-2 py-4 mt-7">
                    Participantes
                </h3>

            </div>

            <div class="flex items-center gap-3">

                <button
                    id="theme-toggle"
                    class="flex h-9 w-9 items-center justify-center rounded-full border border-ink/10 bg-surface text-ink transition hover:bg-bg-soft"
                    aria-label="Alternar tema"
                >
                    <i class="ti ti-moon">🌙</i>
                </button>

            </div>

        </header>


        <form id="form-participante" class="hidden fixed inset-0 z-50 items-center justify-center bg-ink/40 p-4">

            <div class="w-full max-w-[420px] rounded-2xl border border-ink/10 bg-surface p-6 shadow-xl">

                <!-- Cabeçalho -->
                <div class="mb-5 flex items-center justify-between">
                    <div>
                        <h2 class="font-display text-xl font-semibold text-ink">
                            Novo participante
                        </h2>

                        <p class="mt-1 font-body text-xs text-muted">
                            Cadastre um novo participante no EventOS
                        </p>
                    </div>

                    <button
                        type="button"
                        id="fechar-form-participante"
                        aria-label="Fechar formulário"
                        class="flex h-8 w-8 items-center justify-center rounded-full text-muted transition hover:bg-bg-soft hover:text-ink"
                    >
                        ✕
                    </button>
                </div>

                <!-- Campos -->
                <div class="flex flex-col gap-4">

                    <!-- Nome completo -->
                    <div class="flex flex-col gap-1.5">
                        <label
                            for="nome-participante"
                            class="font-body text-sm font-medium text-ink"
                        >
                            Nome completo
                        </label>

                        <input
                            type="text"
                            id="nome-participante"
                            placeholder="Ex: João da Silva"
                            required
                            class="w-full rounded-lg border border-ink/10 bg-bg-soft px-3 py-2 font-body text-sm text-ink outline-none placeholder:text-muted focus:border-accent"
                        >
                    </div>

                    <!-- E-mail -->
                    <div class="flex flex-col gap-1.5">
                        <label
                            for="email-participante"
                            class="font-body text-sm font-medium text-ink"
                        >
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email-participante"
                            placeholder="Ex: joao@email.com"
                            required
                            class="w-full rounded-lg border border-ink/10 bg-bg-soft px-3 py-2 font-body text-sm text-ink outline-none placeholder:text-muted focus:border-accent"
                        >
                    </div>

                    <!-- Telefone -->
                    <div class="flex flex-col gap-1.5">
                        <label
                            for="telefone-participante"
                            class="font-body text-sm font-medium text-ink"
                        >
                            Telefone
                        </label>

                        <input
                            type="tel"
                            id="telefone-participante"
                            placeholder="Ex: (61) 99999-9999"
                            required
                            class="w-full rounded-lg border border-ink/10 bg-bg-soft px-3 py-2 font-body text-sm text-ink outline-none placeholder:text-muted focus:border-accent"
                        >
                    </div>

                    <!-- Botões -->
                    <div class="mt-2 flex justify-end gap-2">

                        <button
                            type="button"
                            id="cancelar-form-participante"
                            class="rounded-full border border-ink/10 px-4 py-2.5 font-body text-sm font-semibold text-ink transition hover:bg-bg-soft"
                        >
                            Cancelar
                        </button>

                        <button
                            type="submit"
                            class="rounded-full bg-accent px-4 py-2.5 font-body text-sm font-semibold text-accent-ink transition hover:opacity-90"
                        >
                            Salvar participante
                        </button>

                    </div>

                </div>

            </div>

        </form>


        <!-- PARTICIPANTES -->

        <div class="overview px-6 py-4">

            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mt-4">

                <!-- TÍTULOS -->

                <div class="flex flex-col">

                    <p class="font-mono text-sm text-muted">
                        Pessoas
                    </p>

                    <h3 class="mt-1 font-display text-2xl font-semibold text-ink px-2">
                        Participantes
                    </h3>

                </div>


                <!-- BUSCA + BOTÃO -->

                <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full md:w-auto">

                    <form id="searchForm" class="relative w-full sm:w-auto">

                        <input
                            type="search"
                            id="searchInput"
                            placeholder="Buscar por nome ou e-mail."
                            autocomplete="off"
                            maxlength="90"
                            class="w-full sm:w-[360px] rounded-full border border-ink/10 bg-bg-soft px-4 py-2 text-sm text-ink! outline-none placeholder:text-ink/50 focus:border-accent"
                        >

                    </form>

                    <button
                        class="rounded-full bg-accent px-4 py-2 font-body text-sm font-semibold text-accent-ink transition hover:opacity-90 bg-accent text-accent-ink!"
                        id="button-add"
                    >
                        + Novo participante
                    </button>

                </div>

            </div>

        </div>

        <!-- ===================== CABEÇALHO DA LISTA ===================== -->
        <div class="hidden sm:flex items-center justify-between gap-4 border-b border-ink/10 px-6 py-3">
            <span class="font-mono text-xs font-semibold uppercase tracking-wide text-muted">
                Participante
            </span>
            <div class="flex items-center gap-4">
                <span class="w-[150px] font-mono text-xs font-semibold uppercase tracking-wide text-muted">
                    Telefone
                </span>
                <span class="w-[76px]"></span>
            </div>
        </div>

        <!-- ===================== LISTA DE PARTICIPANTES ===================== -->

        <div id="participantsList" class="mt-4 px-6">
            <!-- Participantes serão adicionados aqui pelo JavaScript -->
        </div>

    </main>


    <script src="participantes.js"></script>

</body>

</html>
