<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventOS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet"
    >
<link rel="stylesheet" href="global.css">
<link rel="stylesheet" href="inscricoes.css">
<link rel="stylesheet" href="src/output.css">
</head>


 <body>

    <!-- ===================== SIDEBAR ===================== -->

    <aside
    class="fixed top-0 left-0 flex h-screen w-[230px] flex-col justify-between border-r border-ink/10 bg-surface p-6"
    id="sidebar"
>

        <!-- TOPO DA SIDEBAR -->
        <div>

            <!-- BRAND -->
            <div class="flex items-center gap-[7px]">

                <span
                    class="flex h-[34px] w-[34px] items-center justify-center rounded-[9px] bg-gradient-to-br from-accent to-[#FF8A65] font-medium text-white"
                >
                    EF
                </span>

                <span class="font-display text-[1.25rem] font-bold text-ink">
                    EventFlow
                </span>

            </div>

            <!-- NAVEGAÇÃO -->
            <ul
                class="m-0 mt-6 flex list-none flex-col gap-[5px] p-0"
                id="navList"
            >

                <!-- DASHBOARD -->
                <li>
                    <a
                        href="index.html"
                        class="nav-item flex w-full items-center justify-start gap-2 rounded-lg px-3 py-2 font-body hover:bg-bg-soft"
                    >
                        <span class="ico flex w-5 justify-start">◆</span>
                        Dashboard
                    </a>
                </li>

                <!-- EVENTOS -->
                <li>
                    <a
                        href="eventos.html"
                        class="nav-item flex w-full items-center justify-start gap-2 rounded-lg px-3 py-2 font-body hover:bg-bg-soft"
                    >
                        <span class="ico flex w-5 justify-start">🎟</span>
                        Eventos
                    </a>
                </li>

               <!-- PARTICIPANTES -->
<li>
    <a
        href="participantes.html"
        class="nav-item flex w-full items-center justify-start gap-2 rounded-lg px-3 py-2 font-body text-ink! hover:bg-bg-soft"
    >
        <span class="ico flex w-5 justify-start">◉</span>
        Participantes
    </a>
</li>

<!-- INSCRIÇÕES -->
<li>
    <a
        href="inscricoes.html"
        class="nav-item active flex w-full items-center justify-start gap-2 rounded-lg bg-accent px-3 py-2 font-body text-white!"
    >
        <span class="ico flex w-5 justify-start">✔</span>
        Inscrições
    </a>
</li>

            </ul>

        </div>

        <!-- RODAPÉ DA SIDEBAR -->
        <div class="sidebar-foot font-mono text-sm">
            EventFlow v0.2 · por MACIEL//DEV
        </div>

    </aside>


     <div class="scrim" id="scrim"></div>



      <!-- EVENTOS PAGE -->

        <header class="ml-[230px] flex items-center justify-between border-b border-ink/10 bg-surface px-6 py-4">

            <div class="flex items-center gap-4">

                <button
                    id="menuToggle"
                    class="flex md:hidden h-9 w-9 items-center justify-center rounded-full border border-ink/10 bg-surface text-ink"
                    aria-label="Abrir menu"
                >
                    ☰
                </button>

            </div>

            <div class="flex items-center gap-3">

                <button
                    id="theme-toggle"
                    class="flex h-9 w-9 items-center justify-center rounded-full border border-ink/10 bg-surface text-ink transition hover:bg-bg-soft"
                    aria-label="Alternar tema"
                >
                    <i class="ti ti-moon">🌙</i>
                </button>

            </div>

        </header>

        
<form id="form-inscricao" class="hidden fixed inset-0 z-50 items-center justify-center bg-ink/40 p-4">

    <div class="w-full max-w-[420px] rounded-2xl border border-ink/10 bg-surface p-6 shadow-xl">

        
        <!-- Campos -->
        <div class="flex flex-col gap-4">

            <!-- Evento -->
            <div class="flex flex-col gap-1.5">
                <label
                    for="evento-inscricao"
                    class="font-body text-sm font-medium text-ink"
                >
                    Evento
                </label>

                <select
                    id="evento-inscricao"
                    required
                    class="w-full rounded-lg border border-ink/10 bg-bg-soft px-3 py-2 font-body text-sm text-ink outline-none focus:border-accent"
                >
                    <option value="">Selecionar evento</option>
                </select>
            </div>

            <!-- Participante -->
            <div class="flex flex-col gap-1.5">
                <label
                    for="participante-inscricao"
                    class="font-body text-sm font-medium text-ink"
                >
                    Participante
                </label>

                <select
                    id="participante-inscricao"
                    required
                    class="w-full rounded-lg border border-ink/10 bg-bg-soft px-3 py-2 font-body text-sm text-ink outline-none focus:border-accent"
                >
                    <option value="">Selecionar participante</option>
                </select>
            </div>

            <!-- Status -->
            <div class="flex flex-col gap-1.5">
                <label
                    for="status-inscricao"
                    class="font-body text-sm font-medium text-ink"
                >
                    Status
                </label>

                <select
                    id="status-inscricao"
                    required
                    class="w-full rounded-lg border border-ink/10 bg-bg-soft px-3 py-2 font-body text-sm text-ink outline-none focus:border-accent"
                >
                    <option value="">Selecionar status</option>
                    <option value="confirmada">Confirmada</option>
                    <option value="pendente">Pendente</option>
                </select>
            </div>

            <!-- Botões -->
            <div class="mt-2 flex justify-end gap-2">

                <button
                    type="button"
                    id="cancelar-form-inscricao"
                    class="rounded-full border border-ink/10 px-4 py-2.5 font-body text-sm font-semibold text-ink transition hover:bg-bg-soft"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="rounded-full bg-accent px-4 py-2.5 font-body text-sm font-semibold text-accent-ink transition hover:opacity-90"
                >
                    Inscrever
                </button>

            </div>

        </div>

    </div>

</form>

 <!-- INSCRICOES -->

        <div class="overview ml-[230px] px-6 py-4">

            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mt-4">

                <!-- TÍTULOS -->

                <div class="flex flex-col">

                    <p class="font-mono text-sm text-muted">
                       Controle
                    </p>

                    <h3 class="mt-1 font-display text-2xl font-semibold text-ink px-2">
                        Inscrições
                    </h3>

                </div>


                <!-- BUSCA + BOTÃO -->

                <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full md:w-auto">

                    <form id="searchForm" class="relative w-full sm:w-auto">

                        <input
                            type="search"
                            id="searchInput"
                            placeholder="Buscar por nome ou e-mail."
                            autocomplete="off"
                            maxlength="90"
                            class="w-full sm:w-[360px] rounded-full border border-ink/10 bg-bg-soft px-4 py-2 text-sm text-ink! outline-none placeholder:text-ink/50 focus:border-accent"
                        >

                    </form>

                    <button
                        class="rounded-full bg-accent px-4 py-2 font-body text-sm font-semibold text-accent-ink transition hover:opacity-90 bg-accent text-accent-ink!"
                        id="button-add"
                    >
                        + Nova inscrição
                    </button>

                </div>

            </div>

        </div>

         <!-- FILTROS -->
<div class="mt-4 flex ml-[230px] items-center gap-3">

    <select
        id="categoria-card"
        class="h-10 rounded-lg border border-ink/10 bg-surface px-3 text-sm text-ink outline-none focus:border-accent"
    >
        <option value="todas" selected>
            Todos os eventos
        </option>
    </select>

    <select
        id="status-card"
        class="h-10 rounded-lg border border-ink/10 bg-surface px-3 text-sm text-ink outline-none focus:border-accent"
    >
        <option value="todos" selected>
            Todos os status
        </option>
    </select>



</div>

<div class="ml-[230px] mt-6 px-6">
    <div class="overflow-x-auto rounded-2xl border border-ink/10 bg-surface">
        <table class="w-full text-left">
            
            <thead>
                <tr class="border-b border-ink/10">
                    <th class="px-4 py-3 font-body text-sm font-semibold text-ink">
                        Participante
                    </th>
                    <th class="px-4 py-3 font-body text-sm font-semibold text-ink">
                        Evento
                    </th>
                    <th class="px-4 py-3 font-body text-sm font-semibold text-ink">
                        Inscrito em
                    </th>
                    <th class="px-4 py-3 font-body text-sm font-semibold text-ink">
                        Status
                    </th>
                    <th class="px-4 py-3 font-body text-sm font-semibold text-ink">
                        Check-in
                    </th>
                </tr>
            </thead>

            <tbody id="lista-inscricoes">
            </tbody>

        </table>
    </div>
</div>

<script src="inscrito.js"></script>


 </body>
</html>
